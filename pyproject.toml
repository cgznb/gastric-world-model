[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stageworld-gc"
version = "0.1.0"
description = "Treatment-conditioned, observation-updated latent world model for stage-wise gastric-cancer prognosis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Research code; third-party components retain their own licenses"}
authors = [{name = "StageWorld-GC research team"}]
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.8",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "torch>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
clinical-io = ["openpyxl>=3.1", "pandas>=2.2", "pyarrow>=15"]
ct = [
  "pydicom>=3",
  "monai>=1.4",
  "SimpleITK>=2.3",
  "nibabel>=5",
  "einops>=0.8,<1",
]
pathology = ["openslide-python>=1.3", "tifffile>=2024.1", "imagecodecs>=2024.1", "h5py>=3.10"]
gastric-segmentation = ["TotalSegmentator==2.18.0", "nnunetv2==2.8.1"]
survival-reference = ["pycox>=0.3", "torchtuples>=0.2"]
binary-endpoints = ["scikit-learn>=1.4", "openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.12"]

[project.scripts]
stageworld = "stageworld.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "requires_weights: requires approved foundation-model weights",
  "requires_private_data: requires approved local clinical data",
  "integration: crosses package or CLI boundaries",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
