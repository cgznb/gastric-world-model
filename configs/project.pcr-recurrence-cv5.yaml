project:
  name: stageworld_gc_pcr_recurrence_cv5
  mode: real_images
paths:
  data_artifact_root: ${oc.env:STAGEWORLD_GENERATED_DATA_ROOT,null}
  clinical_excel: ${oc.env:STAGEWORLD_CLINICAL_EXCEL,null}
  approved_data_root: ${oc.env:STAGEWORLD_WEIAI_ROOT,null}
  identity_hmac_key_file: ${oc.env:STAGEWORLD_HMAC_KEY_FILE,null}
  feature_root: ${oc.env:STAGEWORLD_TUMOR_ROI_FEATURE_ROOT,null}
  output_root: artifacts/pcr-recurrence-cv5
permissions:
  allow_weight_download: false
  allow_remote_code: false
  allow_long_training: true
  approved_weight_licenses:
  - Apache-2.0
encoders:
  ct_weight_path: ${oc.env:STAGEWORLD_SWINUNETR_WEIGHT,null}
  ct_source_version: monai-1.6.0-legacy-merging-v0.9-compatible-v1
  ct_component_version: swinunetr-ssl-model-swinvit-release-0.8.1
  ct_preprocess_version: flare23-tumor-near40-margin30-stomachfallback40-min192-cube96-v1
  ct_inference_precision: bf16
  segmentation_home: ${oc.env:STAGEWORLD_TUMOR_MODEL,null}
clinical:
  cohort_definition: original_591_paired_ct_development_pool
  primary_endpoint: pcr_recurrence
  baseline_origin_definition: clinical_excel_column_E
  stage0_definition: initialization_only_no_survival_readout
  stage1_definition: generated_state_for_recorded_binary_endpoints
  pcr_definition: BJ_1_yes_2_no_recorded_label
  recurrence_definition: CG_0_1_recorded_status_no_time_window
  clinical_signoff_version: user_recorded_binary_endpoints_2026-09-15
  endpoint_confirmed: true
  time_contract_confirmed: true
  development_stages:
  - s0
  - s1
  ct_series_selection_policy_version: paired-ct-first-acquisition-selection-v1
  treatment_summary_cutoff: completed_before_post_treatment_ct
model:
  survival_task: disabled
  ct_encoder: swinunetr
  pathology_encoder: disabled_for_s0_s1
  pathology_alternatives: []
  freeze_foundation_encoders: true
  hidden_dim: 128
  state_tokens: 8
  stochastic_dim_per_token: 8
  use_stochastic_state: true
  attention_heads: 4
  transition_blocks: 2
  observation_blocks: 1
  resampler_blocks: 1
  ct_tokens: 8
  pathology_tokens: 0
  clinical_input_dim: 8
  action_input_dim: 82
  ct_input_dim: 768
  pathology_input_dim: 768
  dropout: 0.1
survival:
  parameterization: disabled_binary_endpoints
  time_unit: year
  report_horizons_years: []
training:
  phases:
  - world_pretrain
  - joint_endpoints
  seed: 17
  comparison_seeds:
  - 17
  - 43
  - 97
  patient_batch_size: 32
  lr: 0.0002
  joint_backbone_lr: 0.0002
  weight_decay: 0.01
  grad_clip_norm: 1.0
  mixed_precision: bf16
  lr_warmup_epochs: 0
  checkpoint_selection: inner_validation_mean_endpoint_bce
  development_protocol: ct6-pcr-recurrence-cv5-v1
  development_max_epochs: 100
  development_patience: 15
  development_min_delta: 0.0001
  development_max_minutes: null
evaluation:
  split_strategy: patient_level_joint_stratified_5fold_with_inner_validation
  forbid_test_tuning: true
  bootstrap_replicates: 1000
